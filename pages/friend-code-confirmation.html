
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FRNDZ – Join as Friend</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background-color: #e24e08;
      color: white;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      height: 100vh;
      justify-content: center;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 1rem;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 400px;
    }
    input, button {
      padding: 0.75rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
    }
    button {
      background-color: white;
      color: #e24e08;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      opacity: 0.9;
    }
    #result {
      margin-top: 2rem;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <h1>Join Your Friend's Team</h1>
  <form onsubmit="handleJoin(event)">
    <input type="text" id="yourName" placeholder="Your name" required />
    <input type="text" id="friendCode" placeholder="Enter their 6-digit code" maxlength="6" required />
    <button type="submit">Join Team</button>
  </form>
  <div id="result"></div>

  <script>
    function handleJoin(e) {
      e.preventDefault();
      const code = document.getElementById("friendCode").value.trim().toUpperCase();
      const yourName = document.getElementById("yourName").value.trim();
      const playerData = JSON.parse(localStorage.getItem("player_" + code));

      const result = document.getElementById("result");
      if (!playerData || !playerData.name) {
        result.innerHTML = "<p>❌ Invalid code. Please double-check it.</p>";
        return;
      }

      // Save current session details
      localStorage.setItem("frndz_role", "PlayerFRNDZ");
      localStorage.setItem("frndz_code", code);
      localStorage.setItem("frndz_player", playerData.name);

      // Save this friend to the Player's team
      const teamKey = "team_" + code;
      const existing = JSON.parse(localStorage.getItem(teamKey)) || [];
      if (!existing.includes(yourName)) {
        existing.push(yourName);
        localStorage.setItem(teamKey, JSON.stringify(existing));
      }

      result.innerHTML = `
        <p>✅ You're now part of <strong>${playerData.name}</strong>'s team!</p>
        <p>You can now help build their profile. 💘</p>
        <a href="build-profile.html" style="color:white; text-decoration:underline;">Go to Build Profile</a>
      `;

      document.getElementById("friendCode").value = "";
      document.getElementById("yourName").value = "";
    }
  </script>
</body>
</html>
