
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FRNDZ – Player Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="icon" type="image/png" href="../assets/frndz_icon.png" />
  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background-color: #e24e08;
      color: white;
      padding: 2rem;
      min-height: 100vh;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    .section {
      background: white;
      color: #e24e08;
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      text-align: left;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    .section h2 {
      margin-top: 0;
    }
    .section p {
      margin: 0.25rem 0;
    }
    .frndz-list {
      list-style: none;
      padding-left: 1rem;
    }
    .frndz-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.25rem 0;
    }
    .frndz-list button {
      background-color: #e24e08;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.25rem 0.75rem;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .footer {
      font-size: 0.9rem;
      opacity: 0.7;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
    <div id="navbar"></div>
  <h1>Player Dashboard</h1>

  <div class="section">
    <h2>Welcome, <span id="playerName">Player</span></h2>
    <p><strong>Your Friend Code:</strong> <span id="codeText"></span></p>
  </div>

  <div class="section">
    <h2>Your Team of FRNDZ</h2>
    <p>The following friends have signed in with your code:</p>
    <ul id="frndzList" class="frndz-list"></ul>
    <p id="frndzMessage"></p>
  </div>

  <div class="section">
    <h2>Profile Progress</h2>
    <p id="profileStatus">Checking profile status...</p>
  </div>

  <div class="footer">This dashboard is private to you. FRNDZ handles the rest. 💛</div>

  <script type="module">
    import { getCode, getLinkedPlayer, getProfile } from '../scripts/storage.js';

    const playerName = getLinkedPlayer() || 'Unknown';
    const code = getCode();
    document.getElementById("playerName").textContent = playerName;
    document.getElementById("codeText").textContent = code || 'N/A';

    const teamKey = "team_" + code;
    let team = JSON.parse(localStorage.getItem(teamKey)) || [];
    const list = document.getElementById("frndzList");
    const msg = document.getElementById("frndzMessage");

    function renderTeam() {
      list.innerHTML = "";
      if (team.length > 0) {
        team.forEach((name, index) => {
          const li = document.createElement("li");
          li.innerHTML = `<span>👤 ${name}</span> <button onclick="removeFRNDZ(${index})">Remove</button>`;
          list.appendChild(li);
        });
        msg.textContent = "";
      } else {
        msg.textContent = "No FRNDZ have signed in yet. Share your code to invite them.";
      }
    }

    window.removeFRNDZ = function(index) {
      team.splice(index, 1);
      localStorage.setItem(teamKey, JSON.stringify(team));
      renderTeam();
    };

    renderTeam();

    const profile = getProfile();
    const profileStatus = document.getElementById("profileStatus");
    if (profile && profile.name) {
      profileStatus.textContent = "Your profile is currently being managed by your FRNDZ.";
    } else {
      profileStatus.textContent = "Your profile has not been started yet.";
    }
  </script>
    <script type="module">
  // Load navbar.html into #navbar
  fetch('/components/navbar.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('navbar').outerHTML = html;
      // Now load logic
      import('/scripts/nav-loader.js');
    });
</script>
</body>
</html>
