
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FRNDZ – Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background-color: #e24e08;
      color: white;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      height: 100vh;
      justify-content: center;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 1rem;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 400px;
    }
    input, button {
      padding: 0.75rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
    }
    input {
      width: 100%;
    }
    button {
      background-color: white;
      color: #e24e08;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      opacity: 0.9;
    }
    #result {
      margin-top: 2rem;
      font-size: 1.2rem;
    }
    a {
      color: white;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="navbar"></div>
  <h1>Create Your Player Profile</h1>
  <form onsubmit="handleSignup(event)">
    <input type="text" id="playerName" placeholder="Your name" required />
    <button type="submit">Generate Friend Code</button>
  </form>
  <div id="result"></div>

  <script>
    function generateFriendCode(length = 6) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let code = '';
      for (let i = 0; i < length; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return code;
    }

    function handleSignup(e) {
      e.preventDefault();
      const name = document.getElementById("playerName").value;
      const code = generateFriendCode();
      const profile = { name };

      localStorage.setItem("frndz_role", "Player");
      localStorage.setItem("frndz_code", code);
      localStorage.setItem("frndz_player", name);
      localStorage.setItem(`player_${code}`, JSON.stringify(profile));

      const result = document.getElementById("result");
      result.innerHTML = `
        <p>Welcome, <strong>${name}</strong>! 🎉</p>
        <p>Your friend code is:</p>
        <h2>${code}</h2>
        <p>Share this with your FRNDZ so they can build your profile!</p>
        <p>While you wait, <a href="player-dashboard.html">view your Player Dashboard</a>.</p>
      `;

      document.getElementById("playerName").value = "";
    }
  </script>

    <script type="module">
  // Load navbar.html into #navbar
  fetch('/components/navbar.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('navbar').outerHTML = html;
      // Now load logic
      import('/scripts/nav-loader.js');
    });
</script>
  
</body>
</html>
