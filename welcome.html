
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome to FRNDZ</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="icon" type="image/png" href="frndz_icon.png" />
  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background-color: #e24e08;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100vh;
      padding: 2rem;
    }
    .logo-img {
      width: 120px;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
    .tagline {
      font-size: 1.25rem;
      font-style: italic;
      margin-bottom: 2rem;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 300px;
    }
    .buttons a {
      display: block;
      padding: 1rem;
      background-color: white;
      color: #e24e08;
      font-weight: 600;
      border-radius: 10px;
      text-decoration: none;
      font-size: 1.1rem;
    }
    .buttons a:hover {
      opacity: 0.9;
    }
    .footer {
      margin-top: 3rem;
      font-size: 0.9rem;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <img src="/FRNDZ_logo_website.png" alt="FRNDZ Logo" class="logo-img" />
  <h1>Welcome to FRNDZ</h1>
  <div class="tagline">We met through FRNDZ.</div>

  <div class="buttons">
    <a href="pages/signup.html">I'm the Player</a>
    <a href="pages/friend-code-confirmation.html">I'm a Friend</a>
  </div>

  <div class="footer">FRNDZ is where your friends date for you.</div>
</body>
</html>
